name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit + API tests
        run: python -m pytest -q

  postgis-integration:
    runs-on: ubuntu-latest
    needs: test
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: roadworks
          POSTGRES_PASSWORD: roadworks
          POSTGRES_DB: roadworks
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U roadworks"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://roadworks:roadworks@localhost:5432/roadworks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run pipeline and load PostGIS
        run: |
          python -m roadworks.pipeline
          python -m roadworks.load_postgis
      - name: API against PostGIS
        run: python -m pytest -q tests/test_api.py

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t road-works-api .
      - name: Smoke test
        run: |
          docker run -d -p 8000:8000 --name api road-works-api
          for i in $(seq 1 20); do curl -fs localhost:8000/health && exit 0; sleep 1; done
          docker logs api; exit 1
